plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    // Short notation — single quotes
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    api 'org.bouncycastle:bcpkix-jdk18on:1.77'

    // Short notation — double quotes
    implementation "org.mindrot:jbcrypt:0.4"

    // Various scopes
    runtimeOnly 'commons-codec:commons-codec:1.16.0'
    testImplementation 'junit:junit:4.13.2'

    // Parenthesized form (legal Groovy too)
    implementation('com.google.guava:guava:32.1.3-jre')

    // Project dep — must NOT match (no group:artifact:version)
    implementation project(':my-module')

    // File dep — must NOT match
    implementation files('libs/local.jar')

    // Comment with a coordinate inside — should be skipped at the // prefix
    // implementation 'org.evil:do-not-flag:1.0'
}
