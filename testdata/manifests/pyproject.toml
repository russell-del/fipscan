# PEP 621 + Poetry — both styles in one file for fixture coverage
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample"
version = "0.1.0"
dependencies = [
    "django>=4.2",
    "pycrypto==2.6.1",
    "bcrypt>=4.0",
    "cryptography>=41.0",
    "requests",
]

[project.optional-dependencies]
test = ["pytest", "pycrypto==2.6.1"]
dev = [
    "black",
    "argon2-cffi",
    "rbnacl>=1.5.0",
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110"
passlib = "^1.7"
m2crypto = "^0.39"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
pycryptodome = "^3.19"
