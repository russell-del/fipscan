# Self-hosted fipscan server.
#
# 1. Generate a password hash and drop it in a .env file:
#      echo -n 'pick-a-strong-password' | \
#        docker run --rm -i ghcr.io/russell-del/fipscan:latest hash-password
#      echo "FIPSCAN_AUTH_PASSWORD_HASH=pbkdf2-sha256\$600000\$..." > .env
#
# 2. docker compose up -d
# 3. open http://localhost:8080  (user: admin)

services:
  fipscan:
    image: ghcr.io/russell-del/fipscan:latest
    container_name: fipscan
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - fipscan-data:/var/lib/fipscan
    environment:
      FIPSCAN_AUTH_PASSWORD_HASH: "${FIPSCAN_AUTH_PASSWORD_HASH:?set in .env — generate with: fipscan hash-password}"
      # Optional — set FIPSCAN_PUBLIC_URL so alert payloads link to the right hostname:
      # FIPSCAN_PUBLIC_URL: "https://fipscan.example.com"
      # Optional — credentials for private repos / registries:
      # GITHUB_TOKEN: "${GITHUB_TOKEN}"
      # GITLAB_TOKEN: "${GITLAB_TOKEN}"
      # BITBUCKET_USERNAME: "${BITBUCKET_USERNAME}"
      # BITBUCKET_APP_PASSWORD: "${BITBUCKET_APP_PASSWORD}"
      # FIPSCAN_REGISTRY_USERNAME: "${REG_USERNAME}"
      # FIPSCAN_REGISTRY_PASSWORD: "${REG_PASSWORD}"
      TZ: UTC
    healthcheck:
      test: ["CMD", "/usr/local/bin/fipscan", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fipscan-data:
