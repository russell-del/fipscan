<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fipscan — {{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="/">fipscan</a></h1>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/targets/new">Add target</a>
        <a href="/alerts">Alerts</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {{template "content" .}}
  </main>
  <footer>
    <div class="container">
      <small>fipscan {{if .Version}}{{.Version}}{{end}} — FIPS 140-3 readiness scanner</small>
      {{if .FIPSEnabled}}
        <span class="fips-badge fips-on" title="Go Cryptographic Module {{.FIPSModule}}, FIPS mode active at runtime">
          ✓ FIPS 140-3 mode active ({{.FIPSModule}})
        </span>
      {{else if .FIPSModule}}
        <span class="fips-badge fips-warn" title="Module is linked but FIPS mode is disabled at runtime">
          ⚠ FIPS module linked but disabled
        </span>
      {{else}}
        <span class="fips-badge fips-off" title="Binary was built without GOFIPS140=v1.0.0">
          ✗ No FIPS module
        </span>
      {{end}}
    </div>
  </footer>
</body>
</html>
